name: buildwealth

services:
  orchestrator:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/orchestrator.env
    ports:
      - "8090:8090"
    volumes:
      - ../data:/app/data
      # Bind-mount the v2 frontend so static-file edits (HTML, CSS, JS, views/*)
      # appear on browser refresh without a docker rebuild. Backend Python
      # changes still need a rebuild — the wheel installs at image build time.
      - ../services/orchestrator/src/buildwealth_orchestrator/web-v2:/usr/local/lib/python3.12/site-packages/buildwealth_orchestrator/web-v2:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - platform

  account-data-deletion-purge:
    profiles: ["maintenance"]
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    env_file:
      - ./env/orchestrator.env
    volumes:
      - ../data:/app/data
    command: ["buildwealth-maintenance", "purge-due-account-data-deletions", "--pretty"]
    networks:
      - platform

networks:
  platform:
    driver: bridge
