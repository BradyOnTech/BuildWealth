name: buildwealth

services:
  orchestrator:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/orchestrator.env
    ports:
      - "8090:8090"
    volumes:
      - ../data:/app/data
      # Bind-mount the v2 frontend so static-file edits (HTML, CSS, JS, views/*)
      # appear on browser refresh without a docker rebuild. Backend Python
      # changes still need a rebuild — the wheel installs at image build time.
      # Mounted at a stable path (WEB_V2_DIR below) so base-image Python
      # version bumps can't silently break the mount.
      - ../services/orchestrator/src/buildwealth_orchestrator/web-v2:/app/web-v2:ro
    environment:
      - WEB_V2_DIR=/app/web-v2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - platform

  account-data-deletion-purge:
    profiles: ["maintenance"]
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    env_file:
      - ./env/orchestrator.env
    volumes:
      - ../data:/app/data
    command: ["buildwealth-maintenance", "purge-due-account-data-deletions", "--pretty"]
    networks:
      - platform

networks:
  platform:
    driver: bridge
