name: buildwealth

services:
  ghostfolio:
    image: docker.io/ghostfolio/ghostfolio:latest
    restart: unless-stopped
    env_file:
      - ./env/ghostfolio.env
    ports:
      - "3333:3333"
    depends_on:
      ghostfolio-postgres:
        condition: service_healthy
      ghostfolio-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3333/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform

  ghostfolio-postgres:
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ./env/ghostfolio.env
    volumes:
      - ghostfolio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform

  ghostfolio-redis:
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    env_file:
      - ./env/ghostfolio.env
    command:
      - /bin/sh
      - -c
      - redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform

  ignidash-convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: unless-stopped
    ports:
      - "3210:3210"
      - "3211:3211"
    environment:
      RUST_LOG: info
      RUST_BACKTRACE: "1"
      CONVEX_CLOUD_ORIGIN: http://localhost:3210
      CONVEX_SITE_ORIGIN: http://localhost:3211
    volumes:
      - ignidash-convex-data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3210/version"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - platform

  ignidash-convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    restart: unless-stopped
    ports:
      - "6791:6791"
    depends_on:
      ignidash-convex-backend:
        condition: service_healthy
    environment:
      CONVEX_BACKEND_URL: http://ignidash-convex-backend:3210
      NEXT_PUBLIC_DEPLOYMENT_URL: http://localhost:3210
    networks:
      - platform

  ignidash:
    image: ghcr.io/schelskedevco/ignidash:stable
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      ignidash-convex-backend:
        condition: service_healthy
    env_file:
      - ./env/ignidash.env
    environment:
      NODE_ENV: production
      SELF_HOSTED_CONVEX_URL: http://ignidash-convex-backend:3210
      SELF_HOSTED_CONVEX_SITE_URL: http://ignidash-convex-backend:3211
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - platform

  orchestrator:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/orchestrator.env
    ports:
      - "8090:8090"
    depends_on:
      ghostfolio:
        condition: service_healthy
      ignidash:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - platform

volumes:
  ghostfolio-postgres-data:
  ignidash-convex-data:

networks:
  platform:
    driver: bridge
