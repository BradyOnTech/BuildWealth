[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buildwealth-orchestrator"
version = "0.1.0"
description = "BuildWealth financial planning, portfolio analytics, and Copilot orchestrator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0"
]
openbb = [
  "openbb>=4.7.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buildwealth_orchestrator = [
  "data/*.json",
  "web/**/*",
  "web-v2/**/*"
]

[tool.ruff]
line-length = 100
