<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BuildWealth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <p class="brand-eyebrow">BuildWealth</p>
        <p class="brand-title">Control Center</p>
      </div>
      <div class="nav-list" id="nav-list"></div>
    </nav>

    <div class="layout">
      <header class="topbar">
        <h1 id="view-title" class="topbar-title">Today</h1>
        <button class="ghost small" id="toggle-log">Activity Log</button>
      </header>
      <main class="content" id="content"></main>
    </div>

    <aside class="log-drawer" id="log-drawer" hidden>
      <div class="log-head">
        <span class="log-head-title">Activity Log</span>
        <div class="header-actions">
          <button class="ghost small" id="clear-log">Clear</button>
          <button class="ghost small" id="close-log">Close</button>
        </div>
      </div>
      <pre id="log" class="log"></pre>
    </aside>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
