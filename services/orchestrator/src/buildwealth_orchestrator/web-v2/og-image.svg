<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d5d3e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2d5d3e" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Parchment field -->
  <rect width="1200" height="630" fill="#efe9dd"/>
  <!-- Inner hairline frame -->
  <rect x="40" y="40" width="1120" height="550" rx="14" fill="none" stroke="#d4cdb8" stroke-width="2"/>
  <!-- Gilt corner tick -->
  <path d="M1096 74 h30 v30" fill="none" stroke="#c9a04c" stroke-width="4" stroke-linecap="round"/>

  <!-- Masthead -->
  <g transform="translate(84,92)">
    <rect width="46" height="46" rx="11" fill="#2d5d3e"/>
    <path d="M13 33h20M14.5 26.5l5.5-5.5 5.5 4 5.5-8.5" fill="none" stroke="#efe9dd" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#0e1209">BuildWealth</text>
  </g>
  <text x="1116" y="122" text-anchor="end" font-family="'Courier New', monospace" font-size="18" letter-spacing="4" fill="#8c8e80">THE WEALTH ALMANAC</text>

  <!-- Headline -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#0e1209">
    <text x="82" y="272" font-size="76">Understand your money.</text>
    <text x="82" y="360" font-size="76">Model your future.</text>
    <text x="82" y="448" font-size="76" font-style="italic" fill="#1f4530">Act on evidence.</text>
  </g>

  <!-- Sparkline motif -->
  <g transform="translate(82,486)">
    <path d="M0 44 L120 38 L240 41 L360 28 L480 31 L600 18 L720 22 L840 10 L960 13 L1036 4 L1036 60 L0 60 Z" fill="url(#spark)"/>
    <path d="M0 44 L120 38 L240 41 L360 28 L480 31 L600 18 L720 22 L840 10 L960 13 L1036 4" fill="none" stroke="#2d5d3e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footline -->
  <text x="82" y="576" font-family="'Courier New', monospace" font-size="19" letter-spacing="1.5" fill="#4d5448">Private, local-first financial workspace  ·  Portfolio  ·  Plan  ·  Copilot</text>
</svg>
